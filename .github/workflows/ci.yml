name: Reservations API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservations_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check app tests alembic scripts

      - name: Format check
        run: python -m black --check app tests alembic scripts

      - name: Security scan
        run: python -m bandit -r app

      - name: Test
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: PostgreSQL migration and integration smoke
        run: |
          set -euo pipefail
          export DATABASE_URL=postgresql+psycopg2://postgres@localhost:5432/reservations_ci
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export JWT_ISSUER=labtrans-auth-api
          export JWT_AUDIENCE=labtrans-reservas
          export CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          python -m alembic upgrade head
          python -m app.seed
          python scripts/ci_postgres_smoke.py
