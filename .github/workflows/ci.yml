name: Reservations API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests alembic

      - name: Format check
        run: python -m black --check app tests alembic

      - name: Security scan
        run: python -m bandit -r app

      - name: Test
        run: python -m pytest
