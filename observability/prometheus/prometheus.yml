global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: auth-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:5001

  - job_name: reservations-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
